<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Librairi-E – Chrétienne et impactante</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/favicon-192.png">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-orb o1"></div><div class="bg-orb o2"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/img/logo_icc_rennes_bar_white.png" alt="ICC Rennes - Impact Centre Chrétien" class="brand-logo-img">
      <div class="brand-sub">Librairie Chrétienne</div>
    </div>
    <div class="user-badge" id="userBadge" title="Changer d'utilisateur">
      <div class="avatar" id="userAvatar">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;color:var(--mut)">Libraire connecté</div>
        <b id="userNameDisplay" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">...</b>
      </div>
      <button class="btn sm ghost" id="btnSwitchUser" style="padding:4px 8px;font-size:12px" title="Changer ou gérer les profils">
        <svg class="ico sm" viewBox="0 0 24 24"><path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/></svg>
      </button>
    </div>
    <nav id="nav">
      <a data-v="dashboard" id="nav-dashboard"><i><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></i>Tableau de bord<span class="kbd-hint">F1</span></a>
      <a data-v="pos" id="nav-pos"><i><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></i>Caisse<span class="kbd-hint">F2</span></a>
      <a data-v="stock" id="nav-stock"><i><svg class="ico" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></i>Stock<span class="kbd-hint">F3</span></a>
      <a data-v="catalog" id="nav-catalog"><i><svg class="ico" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></i>Catalogue &amp; packs<span class="kbd-hint">F4</span></a>
      <a data-v="sales" id="nav-sales"><i><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg></i>Ventes<span class="kbd-hint">F5</span></a>
      <a data-v="treasury" id="nav-treasury"><i><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><circle cx="12" cy="15" r="2"/></svg></i>Trésorerie &amp; Caisse<span class="kbd-hint">F6</span></a>
      <a data-v="orders" id="nav-orders"><i><svg class="ico" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6"/></svg></i>Réservations<span class="kbd-hint">F7</span></a>
      <a data-v="audit" id="nav-audit"><i><svg class="ico" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></i>Historique &amp; Audit<span class="kbd-hint">F8</span></a>
      <a data-v="data" id="nav-data"><i><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></i>Données &amp; Excel<span class="kbd-hint">F9</span></a>
    </nav>
    <div class="side-foot" id="sideFoot">● Base SQLite &amp; Audit actif<br>Excel miroir automatique</div>
  </aside>
  <main class="content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="title">Tableau de bord</h1>
        <div id="topTitleExtra"></div>
        <div id="focusBanner" class="focus-banner" style="display:none">
          <span class="focus-pulse"></span>
          <span>MODE FOCUS ACTIF</span>
        </div>
      </div>
      <div class="topbar-center">
        <div id="topActions"></div>
      </div>
      <div class="topbar-permanent">
        <button id="btnThemeToggle" class="btn-theme-toggle" title="Basculer le thème (Auto système / Clair / Sombre) [F10]">
          <svg class="ico sm" id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span id="themeLabel">Thème</span>
          <span class="kbd-hint">F10</span>
        </button>
        <button id="btnFocusMode" class="btn btn-focus-toggle" title="Basculer en Mode Focus (sécurise et restreint le poste aux opérations de vente) [F11]">
          <svg class="ico sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span id="focusBtnLabel">Mode Focus</span>
          <span class="kbd-hint">F11</span>
        </button>
      </div>
    </header>

    <section id="view"></section>
  </main>
</div>
<div id="modalRoot"></div><div id="toasts"></div>
<script src="/static/app.js?v=20261017b"></script>
</body>
</html>
